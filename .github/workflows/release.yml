name: Release Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach to (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore Bloxstrap.sln

      - name: Publish
        run: dotnet publish -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=tags/${{ inputs.tag || github.ref_name }} -r win-x64 -c Release --self-contained false .\Bloxstrap\Bloxstrap.csproj

      - name: Rename binary
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $src = ".\Bloxstrap\bin\Release\net6.0-windows\win-x64\publish\Bloxstrap.exe"
          $dst = "MagicalLauncher-$tag.exe"
          Copy-Item $src $dst
          Write-Host "Built $dst"
          Get-Item $dst | Select-Object Name, Length

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Magical Launcher ${{ inputs.tag || github.ref_name }}
          files: MagicalLauncher-*.exe
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
