name: Build Magical Launcher

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'
        
    - name: Restore dependencies
      run: dotnet restore Bloxstrap.sln
      
    - name: Build
      run: dotnet publish Bloxstrap.sln -c Release -r win-x64 --self-contained false
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Magical-Launcher
        path: Bloxstrap/bin/Release/net6.0-windows/win-x64/publish/
